		.flexgrid>div {
			border: solid 2px #000;

			display: inline-block;
			flex: 1 4 20vw;
			height: 200px;
			margin: 0.5vmin;
			overflow: hidden;
			position: relative;
			transition: 500ms;
			box-shadow: 1px 2px 3px 4px rgba(0, 0, 0, 0.2);
		}

		.flexgrid>div:hover {
			flex: 2 1 33%;
			transition: 500ms;
		}
